name: AWF GitHub-hosted worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Worker mode
        required: true
        type: string
      attempt_id:
        description: Controller attempt id
        required: true
        type: string
      attempt_no:
        description: Controller attempt number
        required: true
        type: string
      machine_id:
        description: Controller logical machine id
        required: true
        type: string
      model:
        description: Exact OpenCode free model selected by Controller
        required: true
        type: string
      artifact_name:
        description: Exact result artifact name
        required: true
        type: string
      target_repo:
        description: owner/repo target
        required: true
        type: string
      target_owner:
        description: target owner
        required: true
        type: string
      target_name:
        description: target repository name
        required: true
        type: string
      target_visibility:
        description: public/private/internal from Repo Passport
        required: true
        type: string
      base_sha:
        description: exact target base commit
        required: true
        type: string
      task_b64:
        description: Controller TaskSpec as base64url JSON
        required: true
        type: string
      passport_b64:
        description: Controller Repo Passport as base64url JSON
        required: true
        type: string
      quality_profile_b64:
        description: trusted QualityProfile as base64url JSON
        required: true
        type: string
      source_attempt_id:
        description: source candidate attempt id for review mode
        required: false
        default: ""
        type: string
      source_artifact_id:
        description: source write artifact id for review mode
        required: false
        default: ""
        type: string
      source_artifact_digest:
        description: source write artifact sha256 digest for review mode
        required: false
        default: ""
        type: string
      candidate_hash:
        description: exact candidate hash for review mode
        required: false
        default: ""
        type: string
      patch_sha256:
        description: exact candidate patch hash for review mode
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: awf-${{ inputs.attempt_id }}
  cancel-in-progress: false

jobs:
  worker:
    name: awf-${{ inputs.attempt_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate dispatch envelope
        shell: bash
        env:
          AWF_MODE: ${{ inputs.mode }}
          AWF_ATTEMPT_ID: ${{ inputs.attempt_id }}
          AWF_ATTEMPT_NO: ${{ inputs.attempt_no }}
          AWF_MACHINE_ID: ${{ inputs.machine_id }}
          AWF_MODEL: ${{ inputs.model }}
          AWF_ARTIFACT_NAME: ${{ inputs.artifact_name }}
          AWF_TARGET_REPO: ${{ inputs.target_repo }}
          AWF_TARGET_OWNER: ${{ inputs.target_owner }}
          AWF_TARGET_NAME: ${{ inputs.target_name }}
          AWF_TARGET_VISIBILITY: ${{ inputs.target_visibility }}
          AWF_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          case "$AWF_MODE" in write|review) ;; *) exit 64 ;; esac
          if [ "$AWF_MODE" = write ]; then
            case "$AWF_ATTEMPT_ID" in attempt-*) ;; *) exit 64 ;; esac
          else
            case "$AWF_ATTEMPT_ID" in review-*) ;; *) exit 64 ;; esac
          fi
          case "$AWF_ATTEMPT_NO" in ''|*[!0-9]*) exit 64 ;; esac
          test "$AWF_ATTEMPT_NO" -ge 1
          test -n "$AWF_MACHINE_ID"
          case "$AWF_MODEL" in opencode/*) ;; *) exit 64 ;; esac
          if [ "$AWF_MODE" = write ]; then
            test "$AWF_ARTIFACT_NAME" = "awf-attempt-$AWF_ATTEMPT_ID"
          else
            test "$AWF_ARTIFACT_NAME" = "awf-review-$AWF_ATTEMPT_ID"
          fi
          test "$AWF_TARGET_REPO" = "$AWF_TARGET_OWNER/$AWF_TARGET_NAME"
          case "$AWF_TARGET_REPO" in */*) ;; *) exit 64 ;; esac
          case "$AWF_TARGET_VISIBILITY" in public|private|internal) ;; *) exit 64 ;; esac
          printf '%s' "$AWF_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$AWF_MODE" = review ]; then
            test -n "${{ inputs.source_attempt_id }}"
            printf '%s' "${{ inputs.source_artifact_id }}" | grep -Eq '^[1-9][0-9]*$'
            printf '%s' "${{ inputs.source_artifact_digest }}" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s' "${{ inputs.candidate_hash }}" | grep -Eq '^[0-9a-f]{64}$'
            printf '%s' "${{ inputs.patch_sha256 }}" | grep -Eq '^[0-9a-f]{64}$'
          fi

      - name: Checkout trusted worker-farm source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: worker-farm
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: worker-farm/containers/worker-toolchain/package-lock.json

      - name: Install pinned AWF toolchain
        shell: bash
        working-directory: worker-farm/containers/worker-toolchain
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund --ignore-scripts
          npm explore @opencode/cli -- npm run postinstall
          test "$(./node_modules/.bin/opencode --version)" = "opencode v2.0.18"
          test "$(./node_modules/.bin/pnpm --version)" = "12.4.2"

      - name: Install trusted worker-farm runtime dependencies
        shell: bash
        working-directory: worker-farm
        run: |
          set -euo pipefail
          ./containers/worker-toolchain/node_modules/.bin/pnpm install --frozen-lockfile --ignore-scripts
          ./node_modules/.bin/tsx --version >/dev/null

      - name: Build hardened AWF worker images
        shell: bash
        env:
          AWF_WORKER_IMAGE: awf-worker:${{ inputs.attempt_id }}
          AWF_GATEWAY_IMAGE: awf-egress:${{ inputs.attempt_id }}
        run: |
          set -euo pipefail
          docker version >/dev/null
          DOCKER_BUILDKIT=1 docker build \
            --file worker-farm/containers/worker.Dockerfile \
            --tag "$AWF_WORKER_IMAGE" \
            worker-farm
          DOCKER_BUILDKIT=1 docker build \
            --file worker-farm/containers/egress-gateway.Dockerfile \
            --tag "$AWF_GATEWAY_IMAGE" \
            worker-farm
          test "$(docker image inspect "$AWF_WORKER_IMAGE" --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect "$AWF_GATEWAY_IMAGE" --format '{{.Config.User}}')" = "65532:65532"

      - name: Create read-only target token for non-public target
        if: ${{ inputs.target_visibility != 'public' }}
        id: target-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.AWF_TARGET_APP_ID }}
          private-key: ${{ secrets.AWF_TARGET_APP_PRIVATE_KEY }}
          owner: ${{ inputs.target_owner }}
          repositories: ${{ inputs.target_name }}
          permission-contents: read

      - name: Checkout public target at exact base SHA
        if: ${{ inputs.target_visibility == 'public' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.base_sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout private target at exact base SHA
        if: ${{ inputs.target_visibility != 'public' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.base_sha }}
          path: target
          token: ${{ steps.target-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact target checkout and remove remotes
        shell: bash
        env:
          AWF_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse --verify 'HEAD^{commit}')" = "$AWF_BASE_SHA"
          while IFS= read -r remote; do
            test -z "$remote" || git -C target remote remove "$remote"
          done < <(git -C target remote)
          test -z "$(git -C target remote)"

      - name: Download exact source candidate artifact for review
        if: ${{ inputs.mode == 'review' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AWF_SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          AWF_SOURCE_ARTIFACT_ZIP: ${{ runner.temp }}/awf-source/source.zip
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$AWF_SOURCE_ARTIFACT_ZIP")"
          chmod 700 "$(dirname "$AWF_SOURCE_ARTIFACT_ZIP")"
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const id = process.env.AWF_SOURCE_ARTIFACT_ID;
            if (!/^[1-9][0-9]*$/.test(id || '')) throw new Error('invalid source artifact id');
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${id}/zip`,
              {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  'X-GitHub-Api-Version': '2026-03-10',
                },
                redirect: 'follow',
              },
            );
            if (!response.ok) throw new Error(`source artifact download failed with ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            fs.writeFileSync(process.env.AWF_SOURCE_ARTIFACT_ZIP, bytes, { mode: 0o600 });
          }
          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
          test -s "$AWF_SOURCE_ARTIFACT_ZIP"

      - name: Execute OpenCode worker and deterministic verification
        if: ${{ inputs.mode == 'write' }}
        shell: bash
        working-directory: worker-farm
        env:
          AWF_ATTEMPT_ID: ${{ inputs.attempt_id }}
          AWF_ATTEMPT_NO: ${{ inputs.attempt_no }}
          AWF_MACHINE_ID: ${{ inputs.machine_id }}
          AWF_MODEL: ${{ inputs.model }}
          AWF_TASK_B64: ${{ inputs.task_b64 }}
          AWF_PASSPORT_B64: ${{ inputs.passport_b64 }}
          AWF_QUALITY_PROFILE_B64: ${{ inputs.quality_profile_b64 }}
          AWF_TARGET_CHECKOUT: ${{ github.workspace }}/target
          AWF_OUTPUT_DIR: ${{ runner.temp }}/awf-output
          AWF_WORKER_IMAGE: awf-worker:${{ inputs.attempt_id }}
          AWF_GATEWAY_IMAGE: awf-egress:${{ inputs.attempt_id }}
          AWF_OPENCODE_VERSION: 2.0.18
        run: |
          set -euo pipefail
          mkdir -p "$AWF_OUTPUT_DIR"
          chmod 700 "$AWF_OUTPUT_DIR"
          ./node_modules/.bin/tsx scripts/github_actions_worker.ts
          test -s "$AWF_OUTPUT_DIR/result-manifest.json"
          test -s "$AWF_OUTPUT_DIR/candidate.patch"
          test -s "$AWF_OUTPUT_DIR/verification-report.json"

      - name: Execute model-diverse read-only independent review
        if: ${{ inputs.mode == 'review' }}
        shell: bash
        working-directory: worker-farm
        env:
          AWF_REVIEW_ID: ${{ inputs.attempt_id }}
          AWF_SOURCE_ATTEMPT_ID: ${{ inputs.source_attempt_id }}
          AWF_MACHINE_ID: ${{ inputs.machine_id }}
          AWF_MODEL: ${{ inputs.model }}
          AWF_CANDIDATE_HASH: ${{ inputs.candidate_hash }}
          AWF_PATCH_SHA256: ${{ inputs.patch_sha256 }}
          AWF_TASK_B64: ${{ inputs.task_b64 }}
          AWF_PASSPORT_B64: ${{ inputs.passport_b64 }}
          AWF_TARGET_CHECKOUT: ${{ github.workspace }}/target
          AWF_OUTPUT_DIR: ${{ runner.temp }}/awf-output
          AWF_SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          AWF_SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
          AWF_SOURCE_ARTIFACT_ZIP: ${{ runner.temp }}/awf-source/source.zip
          AWF_WORKER_REPO: ${{ github.repository }}
          AWF_WORKFLOW: awf-worker.yml
          AWF_WORKFLOW_SHA: ${{ github.sha }}
          AWF_WORKER_IMAGE: awf-worker:${{ inputs.attempt_id }}
          AWF_GATEWAY_IMAGE: awf-egress:${{ inputs.attempt_id }}
          AWF_OPENCODE_VERSION: 2.0.18
        run: |
          set -euo pipefail
          mkdir -p "$AWF_OUTPUT_DIR"
          chmod 700 "$AWF_OUTPUT_DIR"
          ./node_modules/.bin/tsx scripts/github_actions_review_worker.ts
          test -s "$AWF_OUTPUT_DIR/independent-review-report.json"

      - name: Capture GitHub-hosted OIDC identity after model execution
        shell: bash
        env:
          AWF_OIDC_AUDIENCE: urn:autonomous-worker-controller
          AWF_OIDC_OUTPUT: ${{ runner.temp }}/awf-output/oidc.jwt
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) throw new Error('GitHub OIDC request environment is unavailable');
            const url = new URL(requestUrl);
            url.searchParams.set('audience', process.env.AWF_OIDC_AUDIENCE);
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${requestToken}` },
            });
            if (!response.ok) throw new Error(`OIDC request failed with ${response.status}`);
            const body = await response.json();
            if (!body || typeof body.value !== 'string' || body.value.split('.').length !== 3) {
              throw new Error('OIDC response did not contain a compact JWT');
            }
            fs.writeFileSync(process.env.AWF_OIDC_OUTPUT, body.value, { mode: 0o600 });
          }
          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE
          test -s "$AWF_OIDC_OUTPUT"
          chmod 600 "$AWF_OIDC_OUTPUT"

      - name: Upload exact AWF write result artifact
        if: ${{ inputs.mode == 'write' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/awf-output/result-manifest.json
            ${{ runner.temp }}/awf-output/candidate.patch
            ${{ runner.temp }}/awf-output/verification-report.json
            ${{ runner.temp }}/awf-output/oidc.jwt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Upload exact AWF review result artifact
        if: ${{ inputs.mode == 'review' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/awf-output/independent-review-report.json
            ${{ runner.temp }}/awf-output/oidc.jwt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
